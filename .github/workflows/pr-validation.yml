name: "PR Validation & Infrastructure Plan"

on:
  pull_request:
    paths:
      - "components/**"

jobs:
  prepare:
    name: Parse & Detect Changes
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.diff.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - name: Detect Changed Components
        id: diff
        run: |
          git fetch origin main

          CHANGED_FILES=$(git diff --name-only origin/main...HEAD | grep '^components/' || true)

          if [ -z "$CHANGED_FILES" ]; then
              echo "Components not modified"
              echo "matrix=[]" >> $GITHUB_OUTPUT
              exit 0
          fi

          COMPONENTS=$(echo "$CHANGED_FILES" | cut -d'/' -f2 | sort -u)
          JSON_ARRAY="["

          for COMPONENT in $COMPONENTS; do
              RUN_TF="false"
              RUN_ANS="false"

              if echo "$CHANGED_FILES" | grep -q "^components/$COMPONENT/terraform"; then
                  RUN_TF="true"
                  RUN_ANS="true"
              fi

              if echo $CHANGED_FILES | grep -q "^components/$COMPONENT/ansible"; then
                  RUN_ANS="true"
              fi

              if [ ! -d "components/$COMPONENT/ansible" ]; then
                  RUN_ANS="false"
              fi

              JSON_ARRAY+="{\"name\": \"$COMPONENT\", \"tf\": $RUN_TF, \"ansible\": $RUN_ANS},"
          done

          JSON_ARRAY=${JSON_ARRAY%,}
          JSON_ARRAY+="]"

          echo "Plan matrix: $JSON_ARRAY"
          echo "matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT

  validate:
    name: "Validate component: ${{ matrix.name }}"
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '[]' }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      TF_DIR: "components/${{ matrix.name }}/terraform"
      ANSIBLE_DIR: "components/${{ matrix.name }}/ansible"
      ANSIBLE_HOST_KEY_CHECKING: "False"
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Terraform check
      - name: "[Terraform] Setup Terraform"
        if: ${{ matrix.tf == true }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: "[Terraform] Terraform init"
        if: ${{ matrix.tf == true }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: "[Terraform] Terraform Format & Validate"
        if: ${{ matrix.tf == true }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform fmt -check
          terraform validate

      - name: "[Terraform] Terraform plan"
        if: ${{ matrix.tf == true }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan

      # Ansible check
      - name: "[Ansible] Setup Python"
        if: ${{ matrix.ansible == true }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "[Ansible] Setup SSH Key"
        if: ${{ matrix.ansible == true }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: "[Ansible] Install versioned roles"
        if: ${{ matrix.ansible == true }}
        working-directory: ${{ env.ANSIBLE_DIR }}
        run: |
          if [ -f "requirements.yml" ]; then
              ansible-galaxy install -r requirements.yml
          fi

      - name: "[Ansible] Ansible Lint"
        if: ${{ matrix.ansible == true }}
        working-directory: ${{ env.ANSIBLE_DIR }}
        run: |
          pip install ansible-lint
          ansible-lint playbook.yml

      - name: "[Ansible] Ansible Syntax Check"
        if: ${{ matrix.ansible == true }}
        working-directory: ${{ env.ANSIBLE_DIR }}
        run: |
          ansible-playbook -i inventory.proxmox.yml playbook.yml --syntax-check
