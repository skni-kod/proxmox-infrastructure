name: "Apply & Merge"

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: write
  issues: write

jobs:
  prepare:
    name: Parse Command & Detect Changes
    runs-on: self-hosted
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/apply') }}
    outputs:
      matrix: ${{ steps.diff.outputs.matrix }}
      branch: ${{ steps.pr-data.outputs.branch }}
    steps:
      - name: Acknowledge Command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST /repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions -F content="rocket"

      - name: Fetch PR Branch Name
        id: pr-data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName)
          BRANCH_NAME=$(echo $PR_JSON | jq -r .headRefName)
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-data.outputs.branch }}
          fetch-depth: 0

      - name: Detect Changed Components
        id: diff
        run: |
          git fetch origin main

          CHANGED_FILES=$(git diff --name-only origin/main...HEAD | grep '^components/' || true)

          if [ -z "$CHANGED_FILES" ]; then
              echo "Components not modified"
              echo "matrix=[]" >> $GITHUB_OUTPUT
              exit 0
          fi

          COMPONENTS=$(echo "$CHANGED_FILES" | cut -d'/' -f2 | sort -u)
          JSON_ARRAY="["

          for COMPONENT in $COMPONENTS; do
              RUN_TF="false"
              RUN_ANS="false"

              if echo "$CHANGED_FILES" | grep -q "^components/$COMPONENT/terraform"; then
                  RUN_TF="true"
                  RUN_ANS="true"
              fi

              if echo $CHANGED_FILES | grep -q "^components/$COMPONENT/ansible"; then
                  RUN_ANS="true"
              fi

              if [ ! -d "components/$COMPONENT/ansible" ]; then
                  RUN_ANS="false"
              fi

              JSON_ARRAY+="{\"name\": \"$COMPONENT\", \"tf\": $RUN_TF, \"ansible\": $RUN_ANS},"
          done

          JSON_ARRAY=${JSON_ARRAY%,}
          JSON_ARRAY+="]"

          echo "Plan matrix: $JSON_ARRAY"
          echo "matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT

  apply:
    name: "Deploy component: ${{ matrix.name }}"
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: self-hosted
    env:
      TF_DIR: "components/${{ matrix.name }}/terraform"
      ANSIBLE_DIR: "components/${{ matrix.name }}/ansible"
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_HOST_PATTERN_MISMATCH: "error"
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_API_TOKEN }}
      PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID }}
      PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.branch }}

      - name: "[Terraform] Setup Terraform"
        if: ${{ matrix.tf == true }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: "[Terraform] Terraform init"
        if: ${{ matrix.tf == true }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: "[Terraform] Terraform apply"
        if: ${{ matrix.tf == true }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve

      # Ansible check
      - name: "[Ansible] Setup SSH Key"
        if: ${{ matrix.ansible == true }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: "[Ansible] Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "[Ansible] Install Ansible"
        run: |
          python -m pip install --upgrade pip
          pip install --ignore-installed ansible requests proxmoxer

      - name: "[Ansible] Install versioned roles"
        if: ${{ matrix.ansible == true }}
        working-directory: ${{ env.ANSIBLE_DIR }}
        run: |
          if [ -f "requirements.yml" ]; then
              ansible-galaxy install -r requirements.yml --force
          fi

      - name: "[Ansible] Run Ansible Playbook"
        if: ${{ matrix.ansible == true }}
        working-directory: ${{ env.ANSIBLE_DIR }}
        run: |
          ansible-playbook -i inventory.proxmox.yml playbook.yml

  merge:
    name: Finalize & Merge Pull Request
    needs: [prepare, apply]
    runs-on: self-hosted
    steps:
      - name: Merge Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ github.event.issue.number }} --repo ${{ github.repository }} --merge --delete-branch

      - name: Post Success Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Infrastructure applied successfully!"
