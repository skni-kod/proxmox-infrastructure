# K8S CLUSTER CONFIGURATION

- name: BaseOS configuration
  hosts: k8s_master,k8s_worker
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - base-os

- name: Configure Kubernetes Cluster
  hosts: k8s_master,k8s_worker
  become: true
  any_errors_fatal: true
  roles:
    - kubernetes

- name: Setup ArgoCD
  hosts: k8s_master
  become: false
  any_errors_fatal: true
  roles:
    - argo-cd
