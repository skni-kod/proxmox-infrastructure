# DYNAMIC INVENTORY CONFIGURATION

plugin: community.proxmox.proxmox
url: https://192.168.1.2:8006
validate_certs: false
want_facts: true

user: terraform-prov@pve
token_id: terraform-token-id

state: running

groups:
  k8s_master: "'k8s_master' in (proxmox_tags_parsed | default([]))"
  k8s_worker: "'k8s_worker' in (proxmox_tags_parsed | default([]))"

compose:
  ansible_host: proxmox_ipconfig0.ip.split('/')[0]
  ansible_user: "'skni-technical-user'"
